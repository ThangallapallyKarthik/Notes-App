<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notes App</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="login-container" id="loginContainer">
  <div class="login-box" id="loginBox">
    <h1>Welcome 👋</h1><p>Sign in to your Notes</p>
    <input id="username" placeholder="Username (demo@user.com)"/>
    <input id="password" type="password" placeholder="Password (Demo@123)"/>
    <button onclick="login()">Login</button>
    <button class="google-btn" onclick="alert('Google Login coming soon')">🔵 Continue with Google</button>
    <p class="link" onclick="showForgot()">Forgot password?</p>
    <p class="link" onclick="showSignup()">Create new account</p>
    <p id="loginError" class="error-message"></p>
    <p class="hint">Sample: <b>demo@user.com / Demo@123</b></p>
  </div>
  <div class="login-box hidden" id="signupBox">
    <h1>Create Account 🆕</h1>
    <input id="signupName" placeholder="Full Name"/>
    <input id="signupEmail" type="email" placeholder="Email"/>
    <input id="signupPassword" type="password" placeholder="Password"/>
    <button onclick="signup()">Create Account</button>
    <p class="link" onclick="showLogin()">⬅ Back to Login</p>
    <p id="signupError" class="error-message"></p>
  </div>
  <div class="login-box hidden" id="forgotBox">
    <h1>Forgot Password 🔒</h1>
    <input id="forgotEmail" type="email" placeholder="Your email"/>
    <button onclick="forgot()">Send Reset Link</button>
    <p class="link" onclick="showLogin()">⬅ Back to Login</p>
    <p id="forgotMsg" class="error-message"></p>
  </div>
</div>

<div class="dashboard" id="dash" style="display:none;">
  <header>
    <h1>My Notes</h1>
    <div class="actions">
      <button onclick="toggleTheme()">🌙</button>
      <button onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="add-note">
    <h2>Create Note</h2>
    <input id="noteTitle" placeholder="Title"/>
    <textarea id="noteContent" placeholder="Take a note..."></textarea>
    <input id="noteColor" placeholder="Color (e.g. #FFD700)" />
    <button onclick="createNote()">Add</button>
    <pre id="noteCreateResult"></pre>
  </div>

  <div class="add-note">
    <h2>Your Notes</h2>
    <div id="notesGrid"></div>
  </div>
</div>

<script>
const API = { login:'/api/auth/login', signup:'/api/auth/register', forgot:'/api/auth/forgot-password', notes:'/api/notes' };
let dark=false;
function qs(id){return document.getElementById(id);}
function showSignup(){qs('loginBox').classList.add('hidden');qs('signupBox').classList.remove('hidden');qs('forgotBox').classList.add('hidden');}
function showLogin(){qs('loginBox').classList.remove('hidden');qs('signupBox').classList.add('hidden');qs('forgotBox').classList.add('hidden');}
function showForgot(){qs('loginBox').classList.add('hidden');qs('signupBox').classList.add('hidden');qs('forgotBox').classList.remove('hidden');}
function toggleTheme(){dark=!dark;document.body.classList.toggle('dark-theme',dark);}

async function login(){
  const u=qs('username').value.trim(), p=qs('password').value.trim(); const err=qs('loginError'); err.textContent='';
  if(u==='demo@user.com'&&p==='Demo@123'){ localStorage.setItem('token','demo'); qs('loginContainer').style.display='none'; qs('dash').style.display='flex'; loadNotes(); return; }
  try{
    const res=await fetch(API.login,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
    if(!res.ok) throw new Error('Invalid credentials');
    const data=await res.json(); localStorage.setItem('token',data.token);
    qs('loginContainer').style.display='none'; qs('dash').style.display='flex'; loadNotes();
  }catch(e){ err.textContent='❌ '+e.message; }
}

async function signup(){
  const name=qs('signupName').value.trim(), email=qs('signupEmail').value.trim(), pass=qs('signupPassword').value.trim();
  const err=qs('signupError'); err.textContent='';
  if(!name||!email||!pass){err.textContent='⚠️ All fields required.'; return;}
  try{
    const res=await fetch(API.signup,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,email,password:pass})});
    if(!res.ok) throw new Error('Signup failed'); alert('✅ Account created. Please login.'); showLogin();
  }catch(e){err.textContent='❌ '+e.message;}
}

async function forgot(){
  const email=qs('forgotEmail').value.trim(); const m=qs('forgotMsg'); m.textContent='';
  if(!email){m.textContent='⚠️ Enter email.'; return;}
  try{
    const res=await fetch(API.forgot,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    if(!res.ok) throw new Error('Email not found'); m.style.color='#00bfa6'; m.textContent='✅ Reset link sent!';
  }catch(e){m.style.color='#e53935'; m.textContent='❌ '+e.message;}
}

function logout(){ localStorage.removeItem('token'); qs('dash').style.display='none'; qs('loginContainer').style.display='flex'; showLogin(); }
function authHeaders(){ const t=localStorage.getItem('token'); return t && t!=='demo' ? {Authorization:`Bearer ${t}`} : {}; }

async function createNote(){
  const title=qs('noteTitle').value.trim(), content=qs('noteContent').value.trim(), color=qs('noteColor').value.trim()||'#FFD700';
  const out=qs('noteCreateResult'); out.textContent='Creating...';
  try{
    const res=await fetch(API.notes,{method:'POST',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({title,content,color})});
    if(!res.ok) throw new Error('Create failed');
    out.textContent='✅ Note created'; qs('noteTitle').value=''; qs('noteContent').value=''; qs('noteColor').value=''; loadNotes();
  }catch(e){out.textContent='❌ '+e.message;}
}

async function loadNotes(){
  const grid=qs('notesGrid'); grid.innerHTML='Loading...';
  try{
    const res=await fetch(API.notes,{headers:{...authHeaders()}});
    if(!res.ok){grid.innerHTML='❌ Failed to load'; return;}
    const notes=await res.json();
    grid.innerHTML = notes.map(n=>`
      <div class="note" style="background:${n.color||'#FFD700'};">
        <b>${escapeHtml(n.title||'Untitled')}</b>
        <div style="white-space:pre-wrap;margin-top:6px;">${escapeHtml(n.content||'')}</div>
        <div style="margin-top:8px;display:flex;gap:8px;">
          <button onclick="editNote('${n.id}')">Edit</button>
          <button onclick="deleteNote('${n.id}')">Delete</button>
        </div>
      </div>`).join('');
  }catch{grid.innerHTML='❌ Error';}
}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));}

async function editNote(id){
  const title=prompt('New title:'); const content=prompt('New content:'); const color=prompt('Color hex (#FFB6C1):');
  if(title===null && content===null && color===null) return;
  await fetch(`${API.notes}/${id}`,{method:'PUT',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({title,content,color})});
  loadNotes();
}
async function deleteNote(id){
  if(!confirm('Delete note?')) return;
  await fetch(`${API.notes}/${id}`,{method:'DELETE',headers:{...authHeaders()}});
  loadNotes();
}
</script>
</body></html>
